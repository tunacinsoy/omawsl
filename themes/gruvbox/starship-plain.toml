# omawsl theme integration, no-Nerd-Font variant - same palette override
# as starship.toml, layered onto starship's own official no-nerd-font
# preset (configs/starship-plain.toml) instead of the icon default.
"$schema" = 'https://starship.rs/config-schema.json'

palette = "gruvbox"

[palettes.gruvbox]
red = "#cc241d"
green = "#98971a"
blue = "#3c8588"
yellow = "#d79921"
magenta = "#b16286"
purple = "#b16286"
orange = "#d65d0e"
cyan = "#689d6a"
black = "#3c3836"
white = "#fbf1c7"
bg = "#282828"
fg = "#d5c4a1"

[azure]
symbol = "☁️ "

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "

[erlang]
symbol = "ⓔ "

[nodejs]
symbol = "[⬢](bold green) "

[pulumi]
symbol = "🧊 "
