"$schema" = 'https://starship.rs/config-schema.json'

# omawsl theme integration (design spec
# docs/superpowers/specs/2026-08-09-starship-default-prompt-design.md) -
# no format override, so starship's real $all default module set stays
# intact; only the named colors its built-in module styles reference get
# remapped to this theme's own palette. This [palettes.*] block is
# duplicated verbatim in this theme's own starship-plain.toml (no TOML
# include mechanism to share it) - keep both in sync if you touch it.
palette = "everforest"

[palettes.everforest]
red = "#e67e80"
green = "#a7c080"
blue = "#7fbbb3"
yellow = "#dbbc7f"
magenta = "#d699b6"
purple = "#d699b6"
orange = "#FF9E64"
cyan = "#83c092"
black = "#4b565c"
white = "#d3c6aa"
bg = "#2b3339"
fg = "#d3c6aa"
