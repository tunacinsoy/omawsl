# omawsl theme integration, no-Nerd-Font variant - same palette override
# as starship.toml, layered onto starship's own official no-nerd-font
# preset (configs/starship-plain.toml) instead of the icon default.
"$schema" = 'https://starship.rs/config-schema.json'

palette = "rose-pine"

[palettes.rose-pine]
red = "#b4637a"
green = "#286983"
blue = "#56949f"
yellow = "#ea9d34"
magenta = "#907aa9"
purple = "#907aa9"
orange = "#fe640b"
cyan = "#d7827e"
black = "#f2e9e1"
white = "#575279"
bg = "#faf4ed"
fg = "#575279"

[azure]
symbol = "☁️ "

[battery]
full_symbol = "• "
charging_symbol = "⇡ "
discharging_symbol = "⇣ "
unknown_symbol = "❓ "
empty_symbol = "❗ "

[erlang]
symbol = "ⓔ "

[nodejs]
symbol = "[⬢](bold green) "

[pulumi]
symbol = "🧊 "
